# Galaxy Card Game - 中继服务器配置文件
# 这个配置文件展示了如何启用中继服务器功能

# 网络设置
use_relay_server = 1                    # 启用中继服务器 (0=禁用, 1=启用)
relay_server_host = localhost           # 中继服务器地址
relay_server_port = 3000                # 中继服务器端口
prefer_relay_over_lan = 0               # 优先使用中继服务器而非局域网 (0=否, 1=是)

# 原有配置项保持不变
use_d3d = 0
antialias = 2
use_image_scale = 1
serverport = 7911
textfontsize = 14
nickname = Player
gamename = Game
roompass =

# 游戏选项
chkMAutoPos = 0
chkSTAutoPos = 1
chkRandomPos = 0
chkAutoChain = 0
chkWaitChain = 0
chkDefaultShowChain = 0
chkIgnore1 = 0
chkIgnore2 = 0

# 音频设置
enable_sound = 1
enable_music = 1
sound_volume = 0.5
music_volume = 0.5

# 窗口设置
window_maximized = 0
window_width = 1024
window_height = 640

# 其他设置
auto_save_replay = 0
hide_setname = 0
hide_hint_button = 0
control_mode = 0
draw_field_spell = 1
separate_clear_button = 1
auto_search_limit = -1
search_multiple_keywords = 1
defaultOT = 1
enable_bot_mode = 0
quick_animation = 0